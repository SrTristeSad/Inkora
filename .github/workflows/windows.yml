name: Inkora Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lua-syntax:
    name: Verify Lua source
    # Use a stable Ubuntu image for reproducible LÖVE/xvfb dependencies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Parse all Lua files
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Smoke test modules
        run: lua5.1 tests/smoke.lua
      - name: Test real public ibisPaint IPV fixture (Android, read-only)
        shell: bash
        run: |
          set -euo pipefail
          # External fixture stays outside git: MIT research template,
          # not a claim of Windows ibisPaint interoperability.
          url="https://raw.githubusercontent.com/fapotaa/ipv-format/a5bded915994dbbf972b549eafe02c6a64c94731/templates/general-30-text-layers.ipv"
          curl -fLsS --retry 3 "$url" -o /tmp/inkora-public-reference.ipv
          expected="d3dc6f83d90f59a3b145967a18d6c6aaabf8356a"
          actual="$(git hash-object /tmp/inkora-public-reference.ipv)"
          test "$actual" = "$expected"
          lua5.1 tests/ipv_real_fixture.lua /tmp/inkora-public-reference.ipv
          lua5.1 tools/inspect_ipv.lua /tmp/inkora-public-reference.ipv > ipv-audit.txt
          cat ipv-audit.txt
      - name: Upload IPV metadata report (no third-party binary)
        uses: actions/upload-artifact@v4
        with:
          name: Inkora-IPV-Audit
          path: ipv-audit.txt
      - name: Compile native C++ engine
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel
          ctest --test-dir build/native --output-on-failure
      - name: Install graphics test dependencies
        timeout-minutes: 20
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y love xvfb
      - name: Real LÖVE + C++ bridge test (virtual display)
        run: INKORA_TILE_LIMIT=8 INKORA_CORE_PATH="$PWD/build/native/libinkora_core.so" INKORA_REQUIRE_NATIVE=1 INKORA_TEST=1 xvfb-run -a timeout 60s love .
      - name: Render redesigned desktop previews
        shell: bash
        run: |
          mkdir -p preview
          for mode in home gallery gallery-folder create brush layers color rotate settings stabilization direction texture wet fill; do
            INKORA_CORE_PATH="$PWD/build/native/libinkora_core.so" INKORA_PREVIEW="$mode" xvfb-run -a timeout 60s love .
            screenshot="$(find "$HOME/.local/share" -type f -name "Inkora-Preview-$mode.png" -print -quit)"
            test -n "$screenshot" || { echo "Screenshot not saved: $mode"; exit 1; }
            cp "$screenshot" "preview/Inkora-Preview-$mode.png"
          done
          ls -lh preview/
      - uses: actions/upload-artifact@v4
        with:
          name: Inkora-Desktop-Previews
          path: preview/*.png

  windows-portable:
    name: Build portable Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows C++ engine
        shell: pwsh
        run: |
          cmake -S native -B build/native -A x64
          cmake --build build/native --config Release
          ctest --test-dir build/native -C Release --output-on-failure
      - name: Bundle LÖVE runtime and Inkora
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile 'love-windows.zip'
          Expand-Archive -Path 'love-windows.zip' -DestinationPath 'love-runtime'
          $runtime = Get-ChildItem 'love-runtime' -Directory | Select-Object -First 1
          if (-not $runtime) { throw 'LÖVE runtime not found in archive' }
          New-Item -ItemType Directory -Path 'dist/Inkora' -Force | Out-Null
          Copy-Item -Path "$($runtime.FullName)/*" -Destination 'dist/Inkora' -Recurse -Force
          Copy-Item -Path 'build/native/Release/inkora_core.dll' -Destination 'dist/Inkora/inkora_core.dll' -Force
          Compress-Archive -Path 'main.lua','conf.lua','src' -DestinationPath 'dist/Inkora.love' -Force
          $loveExe = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist/Inkora/love.exe'))
          $game = [System.IO.File]::ReadAllBytes((Resolve-Path 'dist/Inkora.love'))
          $fused = [System.IO.File]::Create((Join-Path (Resolve-Path 'dist/Inkora') 'Inkora.exe'))
          try {
            $fused.Write($loveExe, 0, $loveExe.Length)
            $fused.Write($game, 0, $game.Length)
          } finally {
            $fused.Dispose()
          }
          Remove-Item 'dist/Inkora/love.exe' -Force
          if (Test-Path 'dist/Inkora/lovec.exe') { Remove-Item 'dist/Inkora/lovec.exe' -Force }
          Compress-Archive -Path 'dist/Inkora/*' -DestinationPath 'dist/Inkora-Windows-portable.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Inkora-Windows-portable
          path: dist/Inkora-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Inkora-Love-source
          path: dist/Inkora.love
